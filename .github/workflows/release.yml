name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact: "Map of Us-${{ github.ref_name }}-*.dmg"
          - os: windows-latest
            platform: win
            artifact: "Map of Us-${{ github.ref_name }}-*-Setup.exe"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
        env:
          AUTH_COOKIE_SECRET: ci-release-secret-32chars!!!!!!!
          SITE_PASSWORD: ci-release-site-pw
          ADMIN_PASSWORD: ci-release-admin-pw

      - name: Build desktop app
        run: npm run desktop:prepare
        env:
          AUTH_COOKIE_SECRET: ci-build-secret-32chars!!!!!!!!!
          SITE_PASSWORD: ci-build-site-pw
          ADMIN_PASSWORD: ci-build-admin-pw

      - name: Package (macOS)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac dmg

      - name: Package (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win nsis --x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/
          retention-days: 7

  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/*
