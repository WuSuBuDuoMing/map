name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
        env:
          AUTH_COOKIE_SECRET: ci-test-secret-32chars!!!!!!!!
          SITE_PASSWORD: ci-test-site-pw
          ADMIN_PASSWORD: ci-test-admin-pw

      - name: Build
        run: node node_modules/next/dist/bin/next build
        env:
          AUTH_COOKIE_SECRET: ci-build-secret-32chars!!!!!!!!!
          SITE_PASSWORD: ci-build-site-pw
          ADMIN_PASSWORD: ci-build-admin-pw
