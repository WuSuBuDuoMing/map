services:
  map-of-us:
    build: .
    container_name: map-of-us
    ports:
      - "3002:3002"
    volumes:
      # Persist user data across container restarts
      - map-of-us-data:/app/data
    environment:
      - NODE_ENV=production
      - MAP_OF_US_STORAGE_MODE=local
      # Override default passwords (optional)
      # - SITE_PASSWORD=your-site-password
      # - ADMIN_PASSWORD=your-admin-password
      # Web deployment with Supabase (optional)
      # - SUPABASE_URL=https://your-project.supabase.co
      # - SUPABASE_SERVICE_ROLE_KEY=your-service-role-key
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  map-of-us-data:
    driver: local
